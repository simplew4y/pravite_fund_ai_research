- candidate_id: qa_kp_100_metric_alias_profile
  candidate_skill_name: metric_alias_profile
  observed_failures:
  - 'metric_alias_error (low): Question appears metric-bearing but grep probe did
    not identify a metric alias family. Evidence: metric_aliases={}'
  failure_types:
  - metric_alias_error
  hypothesis: Company filings use metric aliases that are not captured by generic
    question terms.
  proposed_trigger: Metric-bearing question with missing or weak metric alias anchors.
  proposed_action: Generate or update company profile metric aliases from filing headings
    and table labels.
  risks:
  - Could over-expand aliases and retrieve semantically nearby but wrong metrics.
  required_tests:
  - Alias additions improve retrieval on diagnostic examples without reducing precision
    on holdout metrics.
