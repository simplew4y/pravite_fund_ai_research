schema_version: 1
skill_id: table_evidence_verifier
version: 0.1.0
name: Deterministic Table Evidence Verifier
description: Verify and repair numeric answers using retrieved table facts.
category: verification
type: builtin
phase: post_answer
priority: 100
status: promoted
owner: myz
agents: [quant, general]
routing:
  keywords: [收入, 利润, 毛利率, 现金, 资本, revenue, profit, margin, cash]
evidence_contract:
  company_scope_required: true
  source_evidence_required: true
  allow_cross_company: false
implementation:
  entrypoint: table_answer_repair
permissions:
  network: false
  filesystem_write: false
public: true
governance:
  scope: Verifies and canonicalizes high-confidence numeric/table answers using extracted table facts.
  failure_types: [table_alignment_error, metric_alias_error, answer_coverage_failure]
  trigger: Question asks for numeric table facts and retrieved chunks contain table evidence.
  inputs: [question, generated_answer, retrieved_chunks, reconstructed_table_chunks]
  outputs: [verification_result, repaired_answer, quant_skill_hints, skill_trace]
  risks:
    - Renderer coverage is partial and may leave unsupported table types unchanged.
    - Canonicalization can look rigid when qualitative interpretation is required.
  eval_sets: [zeekr_small30, zeekr_holdout20, final_stack_validation_20260603]
  last_reviewed: "2026-06-05"
  implementation_refs: [src/utils/table_fact_verifier.py, src/utils/table_answer_repair.py, src/utils/table_answer_gate.py]
  notes: Main deterministic numeric verifier for table questions.
