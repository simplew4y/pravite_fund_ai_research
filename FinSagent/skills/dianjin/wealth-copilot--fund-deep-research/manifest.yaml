description: 对单只基金进行全面尽调分析，按基金类型（股票型/债券型/混合型/指数型）自动选择分析路径， 输出业绩、风险、持仓、基金经理能力四维诊断报告。 当用户提到分析基金、基金怎么样、能不能买、基金诊断、基金尽调、这个基金经理靠谱吗时触发。
  不用于多只基金的组合持仓分析（由portfolio-health-check处理）。
