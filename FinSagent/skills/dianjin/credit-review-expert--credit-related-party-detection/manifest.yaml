name: 关联交易识别与关联风险排查
description: 企业客户关联交易识别与关联风险排查技能。通过股权穿透、管理层任职、家族关系、交易集中度、担保链条等多维度识别关联方,检测资金空转、转移定价、虚构交易、利润转移等异常特征,评估关联风险对授信安全的影响,输出结构化关联方图谱与风险报告。用于贷前关联排查、贷中关联交易监测、贷后风险预警。触发词包括:"关联关系识别"、"关联交易分析"、"关联风险排查"、"related
  party detection"、"关联图谱"、"查一下这家企业的关联关系"、"关联交易分析一下"、"担保链分析"。不适用于:贷后风险分类调整、不良资产处置、授信审批决策、股权穿透分析(请使用equity-penetration-analysis)、或无具体企业背景的一般合规咨询。
