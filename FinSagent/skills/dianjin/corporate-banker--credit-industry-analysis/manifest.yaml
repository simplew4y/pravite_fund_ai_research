version: 0.1.0
name: 行业分析（Industry Analysis）
description: 尽调报告-信贷行业深度分析技能。对特定行业进行系统性研究，运用PEST宏观环境分析、波特五力竞争模型、产业链价值链拆解等经典框架，从市场规模测算（TAM/SAM/SOM）、竞争格局演变、供需平衡推演、政策环境梳理、技术趋势研判等多维度全面刻画行业现状，并通过情景分析法对行业短中长期发展趋势进行前瞻预判，为授信决策和行业理解提供专业研究支持。触发词包括："行业分析"、"industry
  analysis"、"行业研究"、"行业评估"、"行业尽调"、"行业准入"、"行业授信政策"、"行业风险排查"。不适用于：企业财务数据分析、股权穿透分析、产品营销方案设计、市场调研、个人信贷行业咨询。
