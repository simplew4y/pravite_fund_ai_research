description: 行业信贷风险审查规则生成技能。针对指定行业或产业,结合行业专业知识、产业链结构、政策环境,深度分析并生成结构化的信贷风险审查规则,涵盖基础事实核查类规则和深度推理类规则。触发词包括:"行业信贷规则生成"、"信贷审查项生成"、"行业风控规则"、"风险审批规则"、"行业审查标准"、"补充行业规则"、"industry
  rule generation"。不适用于:企业个体信用评估、具体授信审批决策、财务数据分析、贷后风险监测。
