name: 海外宏观联动分析技能
description: 海外宏观联动分析技能。当用户要求分析海外宏观数据、美联储政策、美国经济对国内影响、中美联动、外资流向、汇率波动对 A 股债市影响时使用。包括“分析美联储最新决议影响”、“美国经济衰退对中国影响”、“中美宏观联动分析”、“海外宏观周报”、“外资流向分析”、“汇率波动对资产影响”等表述。本技能自动跟踪海外核心宏观指标与政策动态，分析其通过汇率、贸易、情绪、通胀等渠道对国内经济和资本市场的传导影响，输出结构化
  Markdown 联动分析简报。
