name: LR 评分卡建模 (portable)
description: 【LR评分卡建模】当用户需要"逻辑回归"、"LR建模"、"评分卡"、"scorecard"、"WoE建模"、"跑个LR"时使用。基于 WoE 编码 + Logistic Regression
  训练标准评分卡模型，输出系数表、分箱WoE映射、评分卡分数转换。复用平台已有的三段式数据切分、AUC/KS/BCR评估体系、稳定性分析。前提条件：需要已有数据集。**不做超参数调优**；不做特征工程。与
  xgb-modeling 的区别：本 Skill 使用逻辑回归+WoE编码，输出可解释的评分卡模型；xgb-modeling 使用 XGBoost 树模型。
