name: 宏观大类资产配置技能
description: 宏观大类资产配置建议生成技能。当用户要求生成资产配置报告、大类资产配置建议、投资组合配置、股债商品配置策略时使用。包括"生成资产配置建议"、"当前适合配置什么资产"、"股债商品怎么配"、"宏观视角资产配置"、"投资组合配置建议"等表述。本技能结合最新宏观经济数据、政策预判、市场环境，运用美林时钟/宏观象限等分析框架，自动生成股票、债券、商品、外汇等大类资产配置建议，标注配置逻辑、权重建议与风险点，输出面向专业投资机构的
  Markdown 格式资产配置报告。
