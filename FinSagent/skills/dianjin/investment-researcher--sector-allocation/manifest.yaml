schema_version: 1
skill_id: dianjin_investment_researcher_sector_allocation
version: 0.1.0
name: 行业比较与配置推荐 (Sector Allocation & Comparison)
description: 证券策略行业比较与配置推荐技能。适用于策略研究员进行行业轮动分析与资产配置决策。当用户要求生成行业配置建议、行业比较分析、行业轮动策略、行业投资价值排序时使用，包括"行业配置分析"、"行业比较"、"行业轮动"、"推荐配置哪些行业"、"行业投资价值排序"、"行业配置建议"、"行业超配低配"、"当前应该买什么行业"等表述。即使用户只说"行业怎么配"、"看看哪些行业值得投"等简短表述也要触发。本技能自动通过
  上游外部金融数据服务 专业金融数据服务获取行业估值、资金流向、景气度等核心数据，运用4D多维比较框架（景气、估值、资金、政策催化），量化评估各行业投资价值，输出标准化Markdown格式行业配置排序与深度逻辑推演报告。
