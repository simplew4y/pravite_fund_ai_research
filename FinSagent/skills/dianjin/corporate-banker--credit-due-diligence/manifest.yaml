name: 企业信贷尽职调查
description: 企业信贷尽职调查报告生成技能。自动获取企业工商、征信、财务、经营等多维度数据，按银行贷前尽调标准进行系统性分析，覆盖企业基本面、公司治理、关联关系、财务健康、经营真实性验证、主体资信、风险评估及授信建议，输出完整结构化尽调报告。触发词包括："尽职调查"、"尽调报告"、"due
  diligence"、"贷前调查"、"credit investigation"、"做个尽调"、"写尽调报告"。不适用于：贷后管理报告、风险分类调整、不良资产处置、或个人信贷尽调。
