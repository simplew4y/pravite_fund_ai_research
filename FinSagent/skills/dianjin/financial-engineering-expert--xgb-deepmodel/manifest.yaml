name: XGBoost DeepModel — 分群集成建模 (portable)
description: 【DeepModel深度建模】当用户需要"分群集成建模"、"分群+Stacking融合"、"子模型训练+集成"时使用。核心能力：按业务分群条件训练多个 XGBoost 子模型，通过
  Stacking 融合成主模型，并与单模型基线对比。适用于"分群建模"、"按客群分别建模"、"子模型融合"、"集成学习"等高级场景。包含三个脚本：sub_trainer（分群子模型训练）、stacker（XGBoost
  Stacking融合）、comparator（集成vs基线对比）。与 xgb-modeling 的区别：本 Skill 拆分客群分别建模再融合，xgb-modeling 全量样本统一建模。与 segment-modeling
  的区别：本 Skill 专注分群+Stacking融合，segment-modeling 专注分群策略探索。
