version: 0.1.0
name: 访前穿透分析
description: 授信走访前穿透式风险分析技能。整合企业工商、司法、舆情、行内存贷、外部征信五大数据维度,识别红旗/黄旗信号并逐一标注,生成结构化"访前一页纸",辅助客户经理带着问题走访、有的放矢。用于贷前背景调查、存量客户续贷前风险评估、不良预警客户走访准备。触发词包括:"访前分析"、"走访前背景调查"、"访前穿透"、"pre-visit
  analysis"、"走访前帮我查一下"、"整理一下这个客户的情况"、"摸底企业风险"、"生成访前一页纸"。不适用于:贷后风险分类调整、不良资产处置、授信审批决策、贷后监测(请使用loan-risk-monitor)、反欺诈多模态核验(请使用vlm-verifier)、或无具体客户背景的一般风险咨询。
