name: 上市公司深度分析技能
description: 上市公司深度分析技能。当用户要求对公司进行深度分析、全面研究、投资价值分析时使用，包括"分析 XX 公司"、"对 XX 公司做深度研究"、"研究 XX 公司的投资价值"、"XX
  公司深度分析"、"XX 公司全面分析"、"帮我深度研究一下 XX 公司"等表述。本技能从财务分析、业务分析、行业分析、估值分析、风险分析、管理层分析、政策风险七大维度，利用东方财富妙想、企业工商查询等工具获取权威数据，生成面向专业研究员的结构化
  Markdown 深度研究报告。**报告生成后直接在对话中显示完整内容，无需发送文件**。
