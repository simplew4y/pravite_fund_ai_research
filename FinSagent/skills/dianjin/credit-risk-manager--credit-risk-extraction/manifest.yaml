version: 0.1.0
name: 信贷风险结构化提取
description: 历史报告信贷风险分析框架提取技能。基于企业基本情况描述和已知风险情况，输出企业标签画像与风险结构化分析两大部分，遵循GB/T 4754-2017国标行业分类标准，将抽象风险转化为数据可验证的具体规则。当用户提供企业信贷报告、风险评价文本、授信材料，或要求进行企业风险分析、生成风险提取报告时使用此技能。触发词包括:"风险分析"、"风险提取"、"风险结构化"、"标签画像"、"信贷报告分析"。Do
  NOT triggering for:贷后风险监测（请使用loan-risk-monitor）、反欺诈多模态核验（请使用vlm-verifier）、要求输出风险分级或审批意见。
