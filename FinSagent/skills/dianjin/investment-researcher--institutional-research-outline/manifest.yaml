schema_version: 1
skill_id: dianjin_investment_researcher_institutional_research_outline
version: 0.1.0
name: 机构调研大纲生成技能
description: 机构调研大纲生成技能。当用户需要为上市公司调研准备提纲、生成调研问题清单、准备机构调研材料时使用，包括"生成 XX 公司调研大纲"、"准备去 XX 公司调研"、"调研 XX 公司前需要问什么问题"、"帮我写一份调研提纲"等表述。本技能针对上市公司首次调研场景，生成标准版深度（1-2
  小时准备）的结构化调研大纲，包含公司基本面分析、同业对比、历史调研问题回顾和约 10 个核心调研问题，覆盖战略、业务、财务、风险等维度。**报告生成后直接在对话中显示完整内容，无需发送文件**。
