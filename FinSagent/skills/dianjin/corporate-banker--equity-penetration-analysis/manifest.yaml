name: 股权穿透图及关联方分析(Equity Penetration Analysis)
description: 尽调报告-股权穿透图及关联方分析技能。对目标企业进行股权架构逐层穿透至自然人或终极控制人,绘制Mermaid股权架构图,认定实际控制人及一致行动人,识别法定与隐性关联方,分析关联交易公允性与利益输送风险,输出综合评估报告。触发词包括:"股权穿透"、"equity
  penetration"、"关联方分析"、"实控人认定"、"关联关系图谱"、"集团架构穿透"、"关联担保网络"、"股权穿透分析"。不适用于:非股权类数据分析、市场调研、行业宏观分析、简单工商信息查询、无具体企业背景的泛泛咨询、个人信贷股权穿透。
