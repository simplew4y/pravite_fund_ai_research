version: 0.1.0
name: XGBoost 参数调优 (portable)
description: 【XGBoost超参数调优 — 唯一调参入口】当用户说"帮我调参"、"模型过拟合了怎么办"、"调整learning_rate/max_depth等参数"时使用。核心能力：基于 Optuna
  TPE 贝叶斯优化 + 诊断驱动的约束搜索（过拟合→收紧树深度上限，欠拟合→抬高树深度下限），每轮输出诊断报告供用户确认。不做特征探索/特征工程，不批量跑多种方案对比。前置条件：需先用 xgb-modeling
  训练出基线模型。与 auto-experiment 的区别：本Skill只调整"模型超参数"，auto-experiment 负责"自主探索特征和方案"。
