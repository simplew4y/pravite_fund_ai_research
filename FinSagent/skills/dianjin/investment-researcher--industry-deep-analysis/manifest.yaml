version: 0.1.0
name: 行业深度分析技能
description: 行业深度分析技能。当用户要求对某个行业进行深度分析、全面研究、行业投资价值分析时使用，包括"分析 XX 行业"、"对 XX 行业做深度研究"、"XX 行业投资价值分析"、"XX
  行业深度分析"、"XX 行业全面分析"、"帮我深度研究一下 XX 行业"等表述。本技能从行业概况、市场规模、产业链分析、竞争格局、行业趋势、进入壁垒、风险因素、投资机会八大维度，利用 上游外部金融数据服务
  专业金融数据服务获取权威数据，生成面向专业研究员的结构化 Markdown 行业深度研究报告。**报告生成后直接在对话中显示完整内容，无需发送文件**。
