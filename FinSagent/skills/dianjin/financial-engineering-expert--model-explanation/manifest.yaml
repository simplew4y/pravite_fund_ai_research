  - 为什么模型这样预测
  - 哪些特征最重要
  - 解释一下这个样本
  - 模型怎么做的决策
  - feature importance
  - 为什么给这个分数
  - 已训练模型的决策逻辑
  - 建模前的特征质量
  - 模型解释报告
  - 模型解释报告 (portable)
  - 模型解释
  - model explanation
