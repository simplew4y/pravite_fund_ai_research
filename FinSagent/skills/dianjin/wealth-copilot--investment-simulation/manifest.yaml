description: 运用蒙特卡洛模拟对拟投资组合进行多周期收益概率测算， 可视化乐观/中性/悲观三种情景，帮助客户理解预期风险收益。 当用户提到收益模拟、能赚多少、预期收益、蒙特卡洛、 投资回报、投多少能赚多少时触发。
  不用于资产配置方案设计（由asset-allocation-optimizer处理）。
