schema_version: 1
skill_id: dianjin_investment_researcher_market_trend_style_analysis
version: 0.1.0
name: 市场大势与风格研判 (Market Trend & Style Analysis)
description: 证券策略市场大势与风格研判技能。适用于策略研究员进行市场方向判断和风格配置。基于量价、资金、情绪及宏观数据，输出大势研判（牛/熊/震荡）、风格强弱排序（成长/价值/大盘/小盘）及仓位建议，生成标准化
  Markdown 策略报告。当用户要求分析市场大势、判断市场方向、进行风格配置、评估仓位时使用，包括"市场大势分析"、"当前市场怎么样"、"风格怎么配"、"现在该买大盘还是小盘"、"成长和价值哪个强"、"市场趋势研判"、"仓位建议"等表述。即使用户只说"看看大盘"、"市场怎么样"、"现在什么风格"等简短表述也要触发。本技能自动通过
  上游外部金融数据服务 专业金融数据服务获取核心数据，进行量价与逻辑推演，生成标准化策略研判报告。
