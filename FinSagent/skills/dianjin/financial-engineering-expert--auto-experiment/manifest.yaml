schema_version: 1
skill_id: dianjin_financial_engineering_expert_auto_experiment
version: 0.1.0
name: 自主实验循环 (portable)
description: 【自主实验循环·特征组级探索】当用户说"自动探索哪些特征组有用"、"批量对比不同特征组贡献"、"帮我自主试多种方案"、"自动跑一下"、"试各种特征组合"、"自动特征选择"、"消融分析"时使用。核心能力：自动发现数据中的特征分组，按组执行
  独立评估→增量叠加→消融分析→精细筛选 四阶段渐进探索。不做超参数调优，不做单次固定方案训练。与 xgb-tuning 的区别：本 Skill 负责"自主探索特征和方案"，xgb-tuning 负责"调整模型超参数"。与
  xgb-modeling 的区别：本 Skill 自主多轮探索，xgb-modeling 按指定方案单次训练。
