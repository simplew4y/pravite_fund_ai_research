name: 分群自主探索 (portable)
description: 【分群自主探索】当用户需要"分群建模"、"客群拆分训练"、"探索最优分群方案"、"按xxx分组建模"、"不同客群分别训练"、"分群策略"时使用。支持规则分群（人类先验）、聚类分群（无监督发现）、决策树分群（有监督优化），自动探索最优分群策略并汇总子模型。前提条件：需要已完成基线建模（xgb-modeling）。不做全量样本统一建模，不做超参数调优。与
  xgb-modeling 的区别：本 Skill 拆分客群分别建模，xgb-modeling 全量样本统一建模。
