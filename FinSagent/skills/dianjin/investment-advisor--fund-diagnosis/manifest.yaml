schema_version: 1
skill_id: dianjin_investment_advisor_fund_diagnosis
version: 0.1.0
name: 公募基金单基金综合诊断
description: 公募基金单基金综合诊断能力。适用于用户提出"这只基金怎么样""适不适合继续持有""风险和收益特征如何""帮我看看这只基金""XX基金好不好""XX基金值得买吗""XX基金最近表现如何""帮我分析一下XX基金"等泛化诊断问题时，返回结构化的Markdown诊断报告。
  当用户询问某只具体基金的整体评价、持有建议、风险收益特征、基金经理能力、持仓结构、业绩表现等综合性问题时必须使用此技能。 即使用户没有明确说"诊断""分析"，只要涉及单基金的综合性评价就应触发。 覆盖场景：基金评价、持有建议、风险评估、业绩解读、经理分析、持仓解读、基金体检等。
  每次仅分析一只基金，不处理多基金对比与量化建模。 不适用于：多基金对比、基金筛选、具体指标计算、回测建模等场景（这些场景请使用其他对应技能）。
