name: ai-risk-planning
description: 信贷风控任务规划技能。基于贷款申请信息、输入材料(企业基本信息/尽调报告/年报)及宏观信贷策略,以8大风险筛查维度(固定项)为基础框架,叠加行业风险规则(行业项)和动态专项分析建议(针对项),自顶向下规划风险分析任务和数据采集任务,输出结构化JSON任务规划清单。当用户提供贷款申请信息并要求规划风控审查任务、生成尽调清单、制定信贷审查方案时使用此技能。触发词包括:"风控任务规划"、"risk
  planning"、"尽调清单生成"、"信贷审查方案"、"风险分析任务"、"风控规划"、"审查任务规划"。不适用于:贷后管理、风险分类调整、不良资产处置、授信审批决策、或无具体贷款申请背景的一般风控咨询。
