name: 访前规划 (Pre-Visit Planning)
description: 客户经理访前规划技能。基于客户全量数据(行内系统、影像档案、NFS文件、风险预警、行业信息),系统性生成访前准备报告,涵盖客户基本面回顾、近期动态分析、拜访目标设定、材料准备清单、沟通策略与风险提示。当用户要求生成拜访前准备报告、制定客户拜访计划、整理客户背景资料、规划营销拜访策略时使用此技能。触发词包括:"拜访前准备"、"访前规划"、"visit
  planning"、"customer visit preparation"、"拜访计划"、"客户背景分析"。不适用于:拜访后报告生成、授信审批决策、贷款审查、个人信贷访前规划、或无具体客户背景的一般行业研究。
