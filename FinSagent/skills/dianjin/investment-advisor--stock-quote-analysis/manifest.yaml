description: 股票行情与技术分析技能。基于 上游外部金融数据服务 服务查询个股实时行情、分时走势、量价表现与技术指标。当用户询问“今天表现如何”、“近期走势如何”、“是否放量”、“技术面怎么看”、“当前股价多少”或查询
  K 线形态、均线、MACD 等技术指标时使用。即使用户未明确说“行情分析”，只要涉及股价走势研判就应触发。
