schema_version: 1
skill_id: dianjin_investment_researcher_announcement_analysis
version: 0.1.0
name: 重大公告解读技能
description: 解读上市公司重大公告（年报、季报、业绩预告、并购重组、定增、增减持、股权激励、重大合同等），生成结构化的解读报告。适用于基金研究员、投资经理等需要快速理解公告核心信息、分析预期差、提炼投资要点的场景。当用户提到公告解读、公告分析、公告点评、研报点评、业绩解读、财报分析、定增分析、减持分析、股权激励分析、重大合同分析、并购重组分析、回购分析、股权质押分析、诉讼处罚分析时使用此
  skill。默认输出结构化 Markdown 格式报告。
