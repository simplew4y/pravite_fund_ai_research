version: 0.1.0
name: 拜访记录（Visit Memo）
description: 客户经理走访纪要生成技能。将现场拜访的口述观察结构化记录为贷前尽调笔记,支持多轮增量更新与持久化保存。当用户在客户拜访现场口述企业经营状况、厂区观察、财务线索、风险信号、人物印象等信息,或要求记录、整理、更新拜访笔记时使用此技能。触发词包括:"拜访记录"、"走访纪要"、"visit
  memo"、"现场记录"、"记录拜访"、"整理笔记"、"拜访纪要"、"visit record"。不适用于:拜访前规划、授信审批决策、贷后管理报告、正式尽调报告生成、或无具体客户背景的一般咨询。
