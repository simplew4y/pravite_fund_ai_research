schema_version: 1
skill_id: dianjin_investment_researcher_market_sentiment_monitor
version: 0.1.0
name: 市场情绪与风险预警监控 (Market Sentiment & Risk Monitor)
description: 市场情绪与风险预警技能。实时跟踪北向资金、两融余额、龙虎榜资金流向及波动率指标，生成情绪与风险预警信号，提示异常变动，适用于盘中监控与盘后复盘。当用户要求生成市场情绪日报、资金面监控报告、风险预警简报、龙虎榜分析、北向资金点评、两融数据分析、市场情绪体温报告时使用，包括"市场情绪监控"、"今日资金面怎么样"、"北向资金流向"、"两融数据分析"、"龙虎榜解读"、"市场风险预警"、"情绪日报"、"盘中监控"、"盘后复盘"等表述。即使用户只说"看看今天情绪"、"资金面怎么样"、"有没有风险信号"等简短表述也要触发。本技能自动通过
  上游外部金融数据服务 专业金融数据服务获取核心情绪与资金数据，以md格式生成最终报告。
