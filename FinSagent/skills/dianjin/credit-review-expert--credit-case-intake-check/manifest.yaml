name: 案件进件检查
description: 授信申请案件进件合规检查技能。对客户提交的授信申请材料进行完整性校验、基本信息有效性核查、申请金额合理性审查,输出材料清单状态(齐全/缺失)、缺失项严重度分级(阻断/建议补充/信息提示),并给出补充指引。触发词包括:"进件检查"、"进件材料检查"、"case
  intake check"、"帮我检查一下进件材料"、"这个案子材料齐了吗"、"材料校验"、"进件合规检查"、"检查授信材料"。不适用于:贷后管理、风险分类调整、不良资产处置、授信审批决策、客户经理访前分析(请使用pre-visit-credit-analysis)、或无具体案件背景的一般合规咨询。
