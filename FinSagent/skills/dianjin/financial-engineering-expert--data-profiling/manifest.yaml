version: 0.1.0
name: 数据洞察报告 (portable)
description: 【数据轮廓速览】当用户刚上传数据、问"数据有多少行"、"有哪些字段"、"数据长什么样"时使用。描述数据结构（行列数、字段类型、缺失率、分布特征、数据质量），不计算建模指标。无需目标变量。与
  feature-analysis 的区别：只做"描述"不做"分析"，不计算IV/PSI/相关性等建模指标。
