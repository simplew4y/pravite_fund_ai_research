schema_version: 1
skill_id: dianjin_investment_researcher_quant_factor_tracker
version: 0.1.0
name: 量化因子跟踪与评估 (Quant Factor Tracker)
description: 证券金融工程研究员因子跟踪与评估技能。当用户要求跟踪量化因子表现、更新因子库、计算因子IC/IR、分析分组超额收益、评估因子有效性、监控因子衰减或生成因子跟踪报告时触发。包括“因子跟踪”、“计算因子IC”、“因子失效分析”、“生成因子评估报告”、“因子库更新”、“看看这些因子最近表现怎么样”、“跑一下IC和分组收益”等表述。本技能自动获取或接收因子截面数据与下期收益率，计算Rank
  IC、IR、分组超额收益，执行单调性与衰减检验，标记因子强弱状态与失效预警，输出标准化Markdown格式因子跟踪报告。
