description: 宏观风险预警监控技能。当用户要求监控宏观经济数据、预警经济下行/通胀/通缩风险、提示政策转向信号、生成宏观预警报告时使用。本技能实时抓取核心宏观指标，通过对比预期与历史数据识别异动，研判经济衰退、滞胀、通缩或政策收紧风险，并输出包含风险等级、传导逻辑、资产影响及应对建议的结构化
