version: 0.1.0
name: 财务报表深度分析(Financial Report Analysis)
description: 尽调报告-财报分析技能。对上市公司或目标企业的财务报表进行全面深度分析。涵盖资产负债表、利润表、现金流量表三大核心报表的解读,通过计算盈利能力、偿债能力、运营效率、成长能力等关键财务指标,结合杜邦分析法拆解ROE驱动力,评估盈利质量(收现比/净现比),进行财务粉饰识别与风险预警,最终输出结构化的财务健康评估报告,为投资决策和经营管理提供数据支撑。当用户上传财务报表、提供公司名称或股票代码并要求进行财务分析时使用此技能。触发词包括:"财报分析"、"财务报表分析"、"financial
  analysis"、"财务分析"、"分析财报"、"解读财报"、"财报解读"、"财务健康评估"。不适用于:非财务数据分析、市场调研、行业分析、简单数据查询、无具体财务数据的空泛咨询、或个人信贷财务分析。
