name: 上市公司一页纸分析技能
description: 上市公司一页纸分析技能。当用户要求对公司进行简洁分析、快速点评、一页纸分析、速评时使用，包括"XX 公司一页纸"、"快速分析 XX 公司"、"XX 公司速评"、"XX 公司简单分析"、"XX
  公司核心要点"等表述。本技能从核心财务、业务亮点、估值水平、投资逻辑、主要风险五大维度，利用 上游外部金融数据服务 专业金融数据服务获取核心财务与估值数据，生成简洁的一页纸 Markdown 分析报告，聚焦核心信息，适合快速决策参考。**报告生成后直接在对话中显示完整内容，无需发送文件**。
