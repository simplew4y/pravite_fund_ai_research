name: 全球财经要闻简报技能
description: 全球财经要闻自动抓取与简报生成技能。当用户询问财经热点、财经新闻、市场动态、投资热点、生成财经简报，或要求查看今天/最近金融市场有什么大事时触发。即使用户只说"财经热点"、"财经新闻汇总"等简短表述也要触发。本技能自动搜索最新财经资讯（24-72
  小时），智能筛选高影响力事件，按宏观/市场/行业/公司分类汇总，生成结构化简要报告，包含核心头条、市场表现、行业动态、投资机会和风险提示。支持定时任务创建。
