name: 可比公司分析技能 (Comparable Company Analysis)
description: 金融领域的可比公司分析工具，通过行业分析法对目标公司与可比公司整合经营指标、估值倍数和统计基准比较。支持A股、港股、美股市场的上市公司分析。输入单一公司问句后，调用可比公司接口并生成主题化Excel报告。适用于快速对比目标公司与同业在经营、财务、估值维度的差异。数据查询优先使用
  上游外部金融数据服务 服务。
