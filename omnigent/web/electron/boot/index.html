<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>私募研究工作台</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0c;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #3b82f6;
        --err: #f87171;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        gap: 16px;
        text-align: center;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.02em;
      }
      .status {
        color: var(--muted);
        font-size: 0.95rem;
        max-width: 28rem;
        line-height: 1.5;
        min-height: 3em;
      }
      .status.error { color: var(--err); }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #27272a;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .spinner.hidden { display: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .actions { display: none; gap: 10px; margin-top: 8px; }
      .actions.visible { display: flex; }
      button {
        appearance: none;
        border: 1px solid #3f3f46;
        background: #18181b;
        color: var(--fg);
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:hover { filter: brightness(1.08); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <h1>私募研究工作台</h1>
      <p class="status" id="status">正在启动本地服务…</p>
      <div class="actions" id="actions">
        <button type="button" class="primary" id="retry">重试</button>
      </div>
    </div>
    <script>
      const statusEl = document.getElementById("status");
      const spinner = document.getElementById("spinner");
      const actions = document.getElementById("actions");
      const retryBtn = document.getElementById("retry");

      function setStatus(text, isError) {
        statusEl.textContent = text || "";
        statusEl.classList.toggle("error", Boolean(isError));
        spinner.classList.toggle("hidden", Boolean(isError));
        actions.classList.toggle("visible", Boolean(isError));
      }

      async function boot() {
        setStatus("正在启动本地服务…", false);
        const api = window.omnigentDesktopBoot;
        if (!api || typeof api.startStack !== "function") {
          setStatus("桌面启动桥未就绪（omnigentDesktopBoot 缺失）", true);
          return;
        }
        try {
          const result = await api.startStack();
          if (result && result.ok) {
            setStatus("服务已就绪，正在打开工作台…", false);
            return;
          }
          setStatus((result && result.error) || "启动失败", true);
        } catch (err) {
          setStatus(String(err && err.message ? err.message : err), true);
        }
      }

      retryBtn.addEventListener("click", () => boot());
      // Status stream from main
      if (window.omnigentDesktopBoot && typeof window.omnigentDesktopBoot.onStatus === "function") {
        window.omnigentDesktopBoot.onStatus((msg) => {
          if (msg) setStatus(msg, false);
        });
      }
      boot();
    </script>
  </body>
</html>
