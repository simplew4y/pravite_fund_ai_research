[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-fund-compute-worker"
version = "0.1.0"
description = "Pure Python document compute sidecar for the private fund platform"
requires-python = ">=3.9"
dependencies = [
  "openpyxl>=3.1,<4",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
market = [
  "akshare==1.18.81",
  "urllib3==1.26.20; python_version < '3.10'",
]
pdf = [
  "reportlab>=4,<5",
]
all = [
  "akshare==1.18.81",
  "urllib3==1.26.20; python_version < '3.10'",
  "reportlab>=4,<5",
]

[project.scripts]
private-fund-compute-worker = "compute_worker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["compute_worker*"]
